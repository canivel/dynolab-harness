[project]
name = "dynolab-harness"
version = "0.1.0"
description = "Test what AI agents do when the rules get in the way: sandboxed tasks, tripwires, evaluators and signed evidence"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "requests>=2.31", "cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
harness = "harness.__main__:main"

[tool.setuptools]
packages = ["harness"]
include-package-data = true

[tool.setuptools.package-data]
harness = ["builtin/*", "builtin/**/*", "builtin/**/.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
